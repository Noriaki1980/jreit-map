<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J-REIT 取得物件マップ</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --navy: #16233a;
    --navy-2: #1f2d3d;
    --panel-bg: #f7f8fa;
    --border: #e1e4e9;
    --text: #232733;
    --text-dim: #6b7280;
    --accent: #2f6fed;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: "Hiragino Sans","Yu Gothic",-apple-system,sans-serif; color:var(--text); }
  body { display:flex; flex-direction:column; }

  header {
    height: 56px; flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding: 0 16px; background:var(--navy-2); color:#fff; box-sizing:border-box; z-index:1100;
  }
  header .titles { display:flex; align-items:baseline; gap:10px; }
  header h1 { font-size: 15px; margin:0; font-weight:700; letter-spacing:.01em; }
  header .subtitle { font-size:11px; color:#9aa7bb; }
  #updated { font-size:11px; color:#9aa7bb; }
  #sidebarToggle {
    display:none; background:none; border:1px solid #3a4a63; color:#fff; border-radius:6px;
    width:32px; height:32px; font-size:16px; cursor:pointer; margin-right:8px;
  }

  .layout { flex:1; display:flex; min-height:0; }

  #sidebar {
    width: 320px; flex-shrink:0; background:var(--panel-bg); border-right:1px solid var(--border);
    overflow-y:auto; padding:16px; font-size:12.5px;
  }
  #sidebar h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:18px 0 8px; }
  #sidebar h2:first-of-type { margin-top:0; }

  .breadcrumb { display:flex; align-items:center; flex-wrap:wrap; gap:4px; font-size:12.5px; margin-bottom:4px; }
  .crumb { color:var(--accent); cursor:pointer; text-decoration:none; }
  .crumb:hover { text-decoration:underline; }
  .crumb.current { color:var(--text); font-weight:700; cursor:default; text-decoration:none; }
  .crumb-sep { color:var(--text-dim); }

  .stat-row { display:flex; gap:8px; margin-bottom:4px; }
  .stat-card { flex:1; background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .stat-card .num { font-size:19px; font-weight:700; color:var(--navy); line-height:1.2; }
  .stat-card .label { font-size:10.5px; color:var(--text-dim); margin-top:2px; }

  .attr-card {
    display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--border);
    border-radius:8px; background:#fff; cursor:pointer; margin-bottom:6px; transition:box-shadow .15s;
  }
  .attr-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); border-color:var(--accent); }
  .attr-swatch { width:14px; height:14px; border-radius:4px; flex-shrink:0; }
  .attr-name { flex:1; font-weight:600; }
  .attr-count { color:var(--text-dim); font-variant-numeric: tabular-nums; font-size:11.5px; }
  .attr-arrow { color:var(--text-dim); font-size:14px; }

  .filter-actions { display:flex; gap:6px; margin-bottom:8px; }
  .filter-actions button {
    font-size:11px; padding:4px 9px; border-radius:6px; border:1px solid var(--border);
    background:#fff; cursor:pointer; color:var(--text-dim);
  }
  .filter-actions button:hover { border-color:var(--accent); color:var(--accent); }

  #reitFilters { max-height:280px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:#fff; }
  .reit-row {
    display:flex; align-items:center; gap:7px; padding:6px 9px; border-bottom:1px solid #f0f1f4;
    user-select:none;
  }
  .reit-row:last-child { border-bottom:none; }
  .reit-row:hover { background:#f2f4f8; }
  .reit-row input { accent-color:var(--accent); flex-shrink:0; }
  .reit-row .swatch { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .reit-row .name { flex:1; cursor:pointer; }
  .reit-row .count { color:var(--text-dim); font-variant-numeric: tabular-nums; }
  .reit-row .drill { color:var(--accent); cursor:pointer; font-size:13px; padding:2px 4px; flex-shrink:0; }
  .reit-row .drill:hover { text-decoration:underline; }

  .price-range { background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; }
  .price-range input[type=range] { width:100%; accent-color:var(--accent); }
  .price-range .val { display:flex; justify-content:space-between; font-size:11px; color:var(--text-dim); margin-top:2px; }

  .chart-box { background:#fff; border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:4px; }
  .chart-box canvas { max-height:180px; }

  .prop-list { max-height:320px; overflow-y:auto; border:1px solid var(--border); border-radius:8px; background:#fff; }
  .prop-row {
    position:relative; padding:8px 10px; border-bottom:1px solid #f0f1f4; cursor:pointer;
    overflow:hidden;
  }
  .prop-row:last-child { border-bottom:none; }
  .prop-row .prop-row-bg {
    position:absolute; left:0; top:0; bottom:0; background:linear-gradient(90deg, rgba(47,111,237,0.9), rgba(47,111,237,0.35));
    opacity:0.45; z-index:0; transition:opacity .15s;
  }
  .prop-row:hover .prop-row-bg { opacity:0.65; }
  .prop-row .prop-row-content { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .prop-row .pname { font-weight:600; }
  .prop-row .pmeta { color:var(--text-dim); font-size:11px; margin-top:2px; }
  .prop-row .pprice { font-size:12px; font-weight:700; color:var(--navy); white-space:nowrap; flex-shrink:0; }

  #map { flex:1; min-width:0; }

  .popup-title { font-weight:700; margin-bottom:2px; font-size:13px; }
  .popup-row { font-size:12px; color:#333; margin:1px 0; }

  @media (max-width: 780px) {
    #sidebarToggle { display:inline-block; }
    #sidebar {
      position:fixed; top:56px; bottom:0; left:0; width:85vw; max-width:340px;
      transform:translateX(-100%); transition:transform .2s ease; z-index:1050;
      box-shadow: 2px 0 12px rgba(0,0,0,.2);
    }
    #sidebar.open { transform:translateX(0); }
    #map { width:100%; }
  }
</style>
</head>
<body>
<header>
  <div class="titles">
    <button id="sidebarToggle" aria-label="フィルターを開く">☰</button>
    <h1>J-REIT 取得物件マップ</h1>
    <span class="subtitle" id="headerSubtitle">属性別</span>
  </div>
  <div id="updated">読み込み中...</div>
</header>

<div class="layout">
  <aside id="sidebar">
    <div class="breadcrumb" id="breadcrumb"></div>

    <div class="stat-row">
      <div class="stat-card"><div class="num" id="statCount">–</div><div class="label">表示中の物件数</div></div>
      <div class="stat-card"><div class="num" id="statPrice">–</div><div class="label">取得価格合計(億円)</div></div>
    </div>

    <div id="drilldownArea"></div>

    <h2>取得価格(億円)</h2>
    <div class="price-range">
      <input type="range" id="priceMin" min="0" max="500" value="0">
      <input type="range" id="priceMax" min="0" max="500" value="500">
      <div class="val"><span id="priceMinLabel">0億円以上</span><span id="priceMaxLabel">500億円以下</span></div>
    </div>

    <h2 id="barChartTitle">属性別 取得価格合計</h2>
    <div class="chart-box"><canvas id="barChart"></canvas></div>

    <h2>用途別 内訳（件数）</h2>
    <div class="chart-box"><canvas id="pieChart"></canvas></div>
  </aside>

  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://unpkg.com/chart.js@4.4.4/dist/chart.umd.js"></script>
<script>
  const map = L.map('map', {zoomControl:false}).setView([35.68, 137.5], 6);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 19
  }).addTo(map);

  const PALETTE = [
    '#e6194B','#3cb44b','#4363d8','#f58231','#911eb4',
    '#42d4f4','#f032e6','#bfef45','#fabed4','#469990',
    '#dcbeff','#9A6324','#800000','#808000','#000075',
    '#a9a9a9','#e6beff','#000000','#ffd8b1','#aaffc3'
  ];
  const ATTR_PALETTE = {
    "物流施設": "#2f6fed", "ホテル": "#e6194B", "住宅": "#3cb44b",
    "オフィス": "#911eb4", "商業施設": "#f58231", "その他": "#9A6324"
  };
  const reitColorMap = {};
  function reitColor(reit) {
    if (!reitColorMap[reit]) {
      const idx = Object.keys(reitColorMap).length % PALETTE.length;
      reitColorMap[reit] = PALETTE[idx];
    }
    return reitColorMap[reit];
  }
  function attrColor(attr) {
    return ATTR_PALETTE[attr] || '#666666';
  }

  let allRows = [];
  let markers = [];
  let barChart, pieChart;

  let state = { attribute: null, reit: null };
  const activeReits = new Set();
  let priceMin = 0, priceMax = 500;

  function currentScope() {
    return allRows.filter(r => {
      if (state.attribute && r.attribute !== state.attribute) return false;
      if (state.reit && r.reit !== state.reit) return false;
      return true;
    });
  }

  function applyPriceFilter(rows) {
    return rows.filter(r => {
      if (r.price === null) return true;
      return r.price >= priceMin && r.price <= priceMax;
    });
  }

  function applyReitCheckboxFilter(rows) {
    if (state.attribute && !state.reit) {
      return rows.filter(r => activeReits.has(r.reit));
    }
    return rows;
  }

  function visibleRows() {
    return applyReitCheckboxFilter(applyPriceFilter(currentScope()));
  }

  function colorForRow(r) {
    if (!state.attribute) return attrColor(r.attribute);
    return reitColor(r.reit);
  }

  function renderMarkers(rows) {
    markers.forEach(m => map.removeLayer(m.marker));
    markers = [];
    rows.forEach(r => {
      const marker = L.circleMarker([r.lat, r.lng], {
        radius: 7, fillColor: colorForRow(r), color:'#333', weight:1, fillOpacity:.85
      }).addTo(map);
      const price = r.price !== null ? `${r.price}億円` : '価格非公表';
      marker.bindPopup(`
        <div class="popup-title">${r.name}</div>
        <div class="popup-row"><b>${r.reit}</b>（${r.code || ''}）</div>
        <div class="popup-row">属性: ${r.attribute} ／ 所在地: ${r.addr}</div>
        <div class="popup-row">用途: ${r.usage}</div>
        <div class="popup-row">取得(予定)日: ${r.date}</div>
        <div class="popup-row">取得価格: ${price}</div>
        <div class="popup-row" style="color:#888">出典: ${r.source}</div>
      `);
      markers.push({row:r, marker});
    });
  }

  function fitToRows(rows) {
    const pts = rows.filter(r => !isNaN(r.lat) && !isNaN(r.lng)).map(r => [r.lat, r.lng]);
    if (pts.length) map.fitBounds(pts, {padding:[30,30], maxZoom: 12});
  }

  function renderStats(rows) {
    document.getElementById('statCount').textContent = rows.length.toLocaleString();
    const total = rows.reduce((s,r)=> s + (r.price||0), 0);
    document.getElementById('statPrice').textContent = total.toLocaleString(undefined,{maximumFractionDigits:0});
  }

  function renderBreadcrumb() {
    const el = document.getElementById('breadcrumb');
    const parts = [];
    parts.push(state.attribute
      ? `<span class="crumb" data-nav="top">すべて</span>`
      : `<span class="crumb current">すべて</span>`);
    if (state.attribute) {
      parts.push(`<span class="crumb-sep">›</span>`);
      parts.push(state.reit
        ? `<span class="crumb" data-nav="attribute">${state.attribute}</span>`
        : `<span class="crumb current">${state.attribute}</span>`);
    }
    if (state.reit) {
      parts.push(`<span class="crumb-sep">›</span>`);
      parts.push(`<span class="crumb current">${state.reit}</span>`);
    }
    el.innerHTML = parts.join('');
    el.querySelectorAll('.crumb[data-nav]').forEach(elm => {
      elm.addEventListener('click', () => {
        const nav = elm.dataset.nav;
        if (nav === 'top') { state.attribute = null; state.reit = null; }
        if (nav === 'attribute') { state.reit = null; }
        onStateChange();
      });
    });
    document.getElementById('headerSubtitle').textContent =
      state.reit ? state.reit : (state.attribute ? state.attribute + ' 内訳' : '属性別');
  }

  function renderDrilldownArea() {
    const area = document.getElementById('drilldownArea');

    if (!state.attribute) {
      const byAttr = {};
      allRows.forEach(r => {
        if (!byAttr[r.attribute]) byAttr[r.attribute] = {count:0, price:0};
        byAttr[r.attribute].count++;
        byAttr[r.attribute].price += (r.price||0);
      });
      const entries = Object.entries(byAttr).sort((a,b)=>b[1].count-a[1].count);
      area.innerHTML = `<h2>属性で絞り込む（クリックでドリルダウン）</h2>` +
        entries.map(([attr, v]) => `
          <div class="attr-card" data-attr="${attr}">
            <span class="attr-swatch" style="background:${attrColor(attr)}"></span>
            <span class="attr-name">${attr}</span>
            <span class="attr-count">${v.count}件 ／ ${Math.round(v.price).toLocaleString()}億円</span>
            <span class="attr-arrow">›</span>
          </div>
        `).join('');
      area.querySelectorAll('.attr-card').forEach(elm => {
        elm.addEventListener('click', () => {
          state.attribute = elm.dataset.attr;
          state.reit = null;
          const reitsInAttr = new Set(allRows.filter(r=>r.attribute===state.attribute).map(r=>r.reit));
          activeReits.clear();
          reitsInAttr.forEach(r => activeReits.add(r));
          onStateChange(true);
        });
      });
      return;
    }

    if (state.attribute && !state.reit) {
      const rowsInAttr = allRows.filter(r => r.attribute === state.attribute);
      const countByReit = {};
      rowsInAttr.forEach(r => { countByReit[r.reit] = (countByReit[r.reit]||0)+1; });
      const reits = Object.keys(countByReit).sort((a,b)=>countByReit[b]-countByReit[a]);

      area.innerHTML = `
        <h2>${state.attribute} 内のREIT</h2>
        <div class="filter-actions">
          <button id="selAll">すべて選択</button>
          <button id="selNone">すべて解除</button>
        </div>
        <div id="reitFilters"></div>
      `;
      const container = document.getElementById('reitFilters');
      reits.forEach(reit => {
        const row = document.createElement('div');
        row.className = 'reit-row';
        row.innerHTML = `
          <input type="checkbox" ${activeReits.has(reit)?'checked':''} data-reit="${reit}">
          <span class="swatch" style="background:${reitColor(reit)}"></span>
          <span class="name">${reit}</span>
          <span class="count">${countByReit[reit]}</span>
          <span class="drill" title="この銘柄だけを表示">›</span>
        `;
        row.querySelector('input').addEventListener('change', e => {
          if (e.target.checked) activeReits.add(reit); else activeReits.delete(reit);
          onFilterChange();
        });
        row.querySelector('.name').addEventListener('click', () => {
          state.reit = reit;
          onStateChange(true);
        });
        row.querySelector('.drill').addEventListener('click', () => {
          state.reit = reit;
          onStateChange(true);
        });
        container.appendChild(row);
      });
      document.getElementById('selAll').addEventListener('click', () => {
        reits.forEach(r => activeReits.add(r));
        renderDrilldownArea(); onFilterChange();
      });
      document.getElementById('selNone').addEventListener('click', () => {
        reits.forEach(r => activeReits.delete(r));
        renderDrilldownArea(); onFilterChange();
      });
      return;
    }

    if (state.attribute && state.reit) {
      const rows = allRows
        .filter(r => r.attribute===state.attribute && r.reit===state.reit)
        .slice()
        .sort((a, b) => (b.price ?? -Infinity) - (a.price ?? -Infinity)); // 価格が大きい順（非公表は末尾）
      area.innerHTML = `<h2>${state.reit} の物件一覧（取得価格が大きい順）</h2><div class="prop-list" id="propList"></div>`;
      const list = document.getElementById('propList');
      const maxPrice = Math.max(0, ...rows.map(r => r.price || 0));
      rows.forEach(r => {
        const div = document.createElement('div');
        div.className = 'prop-row';
        const price = r.price !== null ? `${r.price}億円` : '価格非公表';
        const barWidth = maxPrice > 0 && r.price !== null ? Math.max(2, (r.price / maxPrice) * 100) : 0;
        div.innerHTML = `
          <div class="prop-row-bg" style="width:${barWidth}%"></div>
          <div class="prop-row-content">
            <div>
              <div class="pname">${r.name}</div>
              <div class="pmeta">${r.addr}</div>
            </div>
            <div class="pprice">${price}</div>
          </div>
        `;
        div.addEventListener('click', () => {
          map.setView([r.lat, r.lng], 14);
          const found = markers.find(m => m.row === r);
          if (found) found.marker.openPopup();
        });
        list.appendChild(div);
      });
      return;
    }
  }

  function renderCharts(rows) {
    if (typeof Chart === 'undefined') {
      console.warn('Chart.js が読み込めていないため、グラフ描画をスキップします');
      return;
    }
    const barCtx = document.getElementById('barChart');
    const barTitle = document.getElementById('barChartTitle');
    let groups = {};
    let groupColor = () => '#999';

    if (!state.attribute) {
      barTitle.textContent = '属性別 取得価格合計';
      rows.forEach(r => { groups[r.attribute] = (groups[r.attribute]||0) + (r.price||0); });
      groupColor = attrColor;
    } else {
      barTitle.textContent = (state.reit ? state.reit : state.attribute) + ' 内 REIT別 取得価格合計';
      rows.forEach(r => { groups[r.reit] = (groups[r.reit]||0) + (r.price||0); });
      groupColor = reitColor;
    }
    const entries = Object.entries(groups).sort((a,b)=>b[1]-a[1]);
    if (barChart) barChart.destroy();
    if (entries.length) {
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels: entries.map(e => e[0].replace('投資法人','')),
          datasets: [{ data: entries.map(e => Math.round(e[1])), backgroundColor: entries.map(e => groupColor(e[0])) }]
        },
        options: {
          indexAxis: 'y',
          plugins: { legend: { display:false } },
          scales: {
            x: { title:{display:true, text:'億円', font:{size:10}}, ticks:{font:{size:9}} },
            y: { ticks:{font:{size:9}} }
          }
        }
      });
    }

    const byUsage = {};
    rows.forEach(r => { byUsage[r.usage] = (byUsage[r.usage]||0) + 1; });
    const usageEntries = Object.entries(byUsage).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const pieCtx = document.getElementById('pieChart');
    if (pieChart) pieChart.destroy();
    if (usageEntries.length) {
      const usagePalette = ['#2f6fed','#f58231','#3cb44b','#911eb4','#e6194B','#42d4f4','#f032e6','#9A6324'];
      pieChart = new Chart(pieCtx, {
        type: 'doughnut',
        data: { labels: usageEntries.map(e=>e[0]), datasets:[{ data: usageEntries.map(e=>e[1]), backgroundColor: usagePalette }] },
        options: { plugins: { legend: { position:'bottom', labels:{font:{size:9}, boxWidth:9} } } }
      });
    }
  }

  function onFilterChange() {
    const rows = visibleRows();
    renderMarkers(rows);
    renderStats(rows);
    renderCharts(rows);
  }

  function onStateChange(shouldFit) {
    renderBreadcrumb();
    renderDrilldownArea();
    const rows = visibleRows();
    renderMarkers(rows);
    renderStats(rows);
    renderCharts(rows);
    if (shouldFit) fitToRows(rows);
  }

  function buildPriceSlider() {
    const prices = allRows.map(r=>r.price).filter(p=>p!==null);
    const maxPrice = prices.length ? Math.ceil(Math.max(...prices)/10)*10 : 500;
    const minEl = document.getElementById('priceMin');
    const maxEl = document.getElementById('priceMax');
    minEl.max = maxPrice; maxEl.max = maxPrice; maxEl.value = maxPrice;
    priceMax = maxPrice;
    function updateLabels() {
      document.getElementById('priceMinLabel').textContent = `${priceMin}億円以上`;
      document.getElementById('priceMaxLabel').textContent = `${priceMax}億円以下`;
    }
    minEl.addEventListener('input', () => { priceMin = Math.min(+minEl.value, priceMax); minEl.value = priceMin; updateLabels(); onFilterChange(); });
    maxEl.addEventListener('input', () => { priceMax = Math.max(+maxEl.value, priceMin); maxEl.value = priceMax; updateLabels(); onFilterChange(); });
    updateLabels();
  }

  const sidebar = document.getElementById('sidebar');
  document.getElementById('sidebarToggle').addEventListener('click', () => sidebar.classList.toggle('open'));

  Papa.parse('data/properties.csv', {
    download: true,
    header: true,
    skipEmptyLines: true,
    encoding: 'UTF-8',
    transformHeader: h => h.replace(/^\uFEFF/, '').trim(),
    complete: function(results) {
      const raw = results.data;
      allRows = raw.map(r => {
        const lat = parseFloat(r['緯度']);
        const lng = parseFloat(r['経度']);
        const priceStr = r['取得価格_億円'];
        const price = priceStr && !isNaN(parseFloat(priceStr)) ? parseFloat(priceStr) : null;
        return {
          reit: r['REIT名'] || '不明',
          code: r['証券コード'] || '',
          name: r['物件名'] || '',
          addr: r['所在地'] || '',
          usage: r['用途'] || '不明',
          attribute: r['属性'] || 'その他',
          date: r['取得予定日'] || '',
          price, lat, lng,
          source: r['出典'] || ''
        };
      }).filter(r => !isNaN(r.lat) && !isNaN(r.lng));

      if (!allRows.length) {
        document.getElementById('updated').textContent = 'データが0件でした（列名の不一致の可能性）';
        return;
      }

      buildPriceSlider();
      onStateChange(false);

      document.getElementById('updated').textContent =
        `総物件数: ${allRows.length} ／ 最終更新: ${window.__LAST_UPDATED__ || '不明'}`;
    },
    error: function(err) {
      document.getElementById('updated').textContent = 'データの読み込みに失敗しました: ' + err;
    }
  });
</script>
<script>window.__LAST_UPDATED__ = "2026-07-27";</script>
</body>
</html>
